server {
	# 8080, not 80: the image runs as an unprivileged user (nginxinc/nginx-unprivileged, see
	# Dockerfile) which can't bind ports below 1024. docker-compose.yml maps host 5173 -> 8080.
	listen 8080;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Don't advertise the nginx version in the Server header or on error pages.
	server_tokens off;

	# ---- Security headers -------------------------------------------------------------------
	# IMPORTANT: nginx only inherits add_header from the enclosing level if the inner block has no
	# add_header of its own. Today no location below defines one, so every response (static files,
	# the SPA fallback, proxied /api/ responses and error pages - hence `always`) carries these.
	# If you ever add an add_header (e.g. Cache-Control) inside a location, repeat the whole set
	# there or it silently loses them.
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	# One-time tokens (invite / reset / verify links) live in page URLs; never send them as a Referer.
	# index.html carries the matching <meta name="referrer">.
	add_header Referrer-Policy "no-referrer" always;
	# The app uses none of these browser features (checked: no getUserMedia / geolocation in web/src).
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

	# Strict-Transport-Security is deliberately NOT enabled: nothing in this repo terminates TLS (the
	# compose stack serves plain HTTP; browsers ignore HSTS received over HTTP anyway), and a wrong
	# HSTS value on a real domain is hard to undo. Once TLS is terminated in front of this container
	# (load balancer / reverse proxy), enable it there or here:
	#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	# (start with a short max-age, and only add `preload` once the whole domain is HTTPS-only).

	# Content-Security-Policy - REPORT-ONLY: violations are logged in the browser console but
	# nothing is blocked. Move to enforcing (rename to Content-Security-Policy) only after
	# exercising the real app under this header (login, uploads, messaging /ws, PDF/CSV downloads)
	# and confirming the console shows no violations. What the app actually loads:
	#   scripts   - only its own bundle (Vite emits one module script, no inline scripts)
	#   styles    - MUI/emotion inject <style> tags at runtime (=> 'unsafe-inline') + Google Fonts CSS
	#   fonts     - fonts.gstatic.com (index.html links Inter from Google Fonts)
	#   images    - own origin, data:/blob: URIs, and uploaded assets served by the API (/uploads)
	#   connect   - fetch/XHR to the API and SockJS/STOMP to its /ws endpoint (http(s) + ws(s))
	# http://localhost:8080 / ws://localhost:8080 below is the API origin the docker-compose build
	# bakes in via VITE_API_BASE_URL (see docker-compose.yml). Replace it with your real API origin
	# (or drop it when the API is same-origin through this server's /api/ proxy).
	# No frame-src/script-src for Razorpay: the frontend contains no payment-checkout integration.
	# frame-ancestors is the CSP twin of X-Frame-Options: DENY above.
	add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: http://localhost:8080; connect-src 'self' http://localhost:8080 ws://localhost:8080; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

	# Mirrors vite.config.ts's dev-server proxy for /api. Same-origin from the browser's point of
	# view when the SPA is built with an empty VITE_API_BASE_URL (see Dockerfile); with a full API
	# URL baked in, the browser talks to that URL directly instead and this proxy goes unused.
	location /api/ {
		proxy_pass http://backend:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		# The backend may set the same headers; hide its copies so the client sees one value, ours.
		proxy_hide_header X-Content-Type-Options;
		proxy_hide_header X-Frame-Options;
		proxy_hide_header Referrer-Policy;
		proxy_hide_header Permissions-Policy;
		proxy_hide_header Content-Security-Policy-Report-Only;
	}

	# React Router uses client-side routing - any path not matching a static file falls
	# back to index.html so a deep-link/refresh doesn't 404.
	location / {
		try_files $uri /index.html;
	}
}
