server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Mirrors vite.config.ts's dev-server proxy - same-origin from the browser's point of
	# view so the SPA needs no VITE_API_BASE_URL override in the container either.
	location /api/ {
		proxy_pass http://backend:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
	}

	# React Router uses client-side routing - any path not matching a static file falls
	# back to index.html so a deep-link/refresh doesn't 404.
	location / {
		try_files $uri /index.html;
	}
}
