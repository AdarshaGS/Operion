<title>Operion Product Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a working ledger. Sticky section index left, wide reading column right; the gap register
   is filterable by severity, MVP and free text. Source of truth is PRODUCT_GAP_AUDIT.md, embedded below. */
:root {
  --bg: #f3f6f8;
  --surface: #ffffff;
  --ink: #15202a;
  --muted: #55636f;
  --line: #d8e0e6;
  --tint: #eaf0f4;
  --accent: #0a5a6a;
  --accent-soft: #dcecef;
  --crit: #a8231b;   --crit-bg: #fbe4e1;
  --high: #a4470a;   --high-bg: #fbe9d8;
  --med: #7a5f00;    --med-bg: #f6efcf;
  --low: #3e6237;    --low-bg: #e3efdf;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --head: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, "Arial Narrow", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e161c; --surface: #141e26; --ink: #e5ecf1; --muted: #98a9b6; --line: #26343f; --tint: #1a2630;
    --accent: #62c5d6; --accent-soft: #15343c;
    --crit: #ff9c92; --crit-bg: #3a1b19;
    --high: #f6b27a; --high-bg: #38240f;
    --med: #e6cf6b;  --med-bg: #322a0b;
    --low: #9fd08f;  --low-bg: #1c2e18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e161c; --surface: #141e26; --ink: #e5ecf1; --muted: #98a9b6; --line: #26343f; --tint: #1a2630;
  --accent: #62c5d6; --accent-soft: #15343c;
  --crit: #ff9c92; --crit-bg: #3a1b19;
  --high: #f6b27a; --high-bg: #38240f;
  --med: #e6cf6b;  --med-bg: #322a0b;
  --low: #9fd08f;  --low-bg: #1c2e18;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); margin: 0; }
.shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 32px; max-width: 1480px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 80px; }
details#toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; max-height: calc(100vh - 32px); overflow: auto; font-size: 13px; padding-right: 6px; }
details#toc summary { display: none; list-style: none; }
details#toc summary::-webkit-details-marker { display: none; }
details#toc .grp { font: 600 10.5px/1 var(--head); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px 10px; }
details#toc .grp:first-of-type { margin-top: 0; }
details#toc a, details#toc a:visited, details#toc a:focus, details#toc a:active { color: var(--ink); text-decoration: none; }
details#toc a { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px; align-items: baseline; padding: 6px 10px; border-radius: 5px; line-height: 1.35; }
details#toc a .n { font: 500 11.5px/1 var(--mono); color: var(--muted); text-align: right; }
details#toc a:hover { background: var(--tint); }
.toc-h { font: 600 11px/1 var(--head); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
main { min-width: 0; }
header.top { padding-block: 8px 20px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
header.top .eyebrow { font: 600 11px/1 var(--head); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
header.top h1 { font: 600 clamp(26px, 4.2vw, 40px)/1.12 var(--head); letter-spacing: -.01em; margin: 10px 0 0; text-wrap: balance; }
.tagkey { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; font-size: 12.5px; color: var(--muted); }
.tagkey span { display: inline-flex; gap: 6px; align-items: center; }
article h1 { font: 600 clamp(22px, 3vw, 30px)/1.2 var(--head); margin: 56px 0 14px; padding-top: 18px; border-top: 2px solid var(--ink); text-wrap: balance; scroll-margin-top: 16px; }
article h2 { font: 600 19px/1.3 var(--head); margin: 32px 0 10px; scroll-margin-top: 16px; }
article h3 { font: 600 15.5px/1.35 var(--sans); margin: 24px 0 8px; }
article p, article ul, article ol { max-width: 78ch; margin: 0 0 12px; }
article li { margin: 3px 0; }
article a { color: var(--accent); }
article hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
article code { font: 12.5px/1.4 var(--mono); background: var(--tint); padding: 1px 5px; border-radius: 3px; overflow-wrap: anywhere; }
article pre { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; overflow-x: auto; margin: 14px 0; }
article pre code { background: none; padding: 0; font-size: 12.5px; white-space: pre; overflow-wrap: normal; }
article blockquote { margin: 18px 0; padding: 14px 18px; background: var(--accent-soft); border-left: 3px solid var(--accent); font: 500 17px/1.5 var(--head); max-width: 78ch; }
article blockquote p { margin: 0; max-width: none; }
.tw { overflow-x: auto; margin: 14px 0 22px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; line-height: 1.45; }
th { text-align: left; font: 600 11px/1.2 var(--head); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); background: var(--tint); padding: 9px 10px; white-space: nowrap; position: sticky; top: 0; }
td { padding: 9px 10px; vertical-align: top; border-top: 1px solid var(--line); min-width: 84px; }
tbody tr:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
td:first-child { font-weight: 500; }
table.t-12 { min-width: 1500px; }
table.t-12 td:nth-child(1) { min-width: 66px; font-family: var(--mono); font-size: 12px; white-space: nowrap; }
table.t-12 td:nth-child(4) { min-width: 330px; }
table.t-12 td:nth-child(5) { min-width: 230px; }
table.t-12 td:nth-child(10) { min-width: 240px; }
table.t-6, table.t-7, table.t-8, table.t-9 { min-width: 760px; }
table.t-5 { min-width: 760px; }
table.t-5 td:nth-child(1) { min-width: 110px; font-weight: 600; }
table.t-5 td:nth-child(2) { min-width: 320px; }
table.t-5 td:nth-child(4) { text-align: center; white-space: nowrap; }
table.t-5 td:nth-child(5) { min-width: 230px; }
.chip { display: inline-block; font: 600 11px/1 var(--head); letter-spacing: .05em; text-transform: uppercase; padding: 4px 7px; border-radius: 3px; white-space: nowrap; }
.chip.critical { color: var(--crit); background: var(--crit-bg); }
.chip.high { color: var(--high); background: var(--high-bg); }
.chip.medium { color: var(--med); background: var(--med-bg); }
.chip.low { color: var(--low); background: var(--low-bg); }
.chip.yes { color: var(--accent); background: var(--accent-soft); }
.tg { font: 500 10.5px/1 var(--mono); padding: 2px 4px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); vertical-align: 1px; white-space: nowrap; }
.tg.v { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.tg.u { color: var(--med); border-color: color-mix(in srgb, var(--med) 45%, var(--line)); }
.tg.r { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 45%, var(--line)); }
.st { font-weight: 600; }
.st.ok { color: var(--low); } .st.part { color: var(--med); } .st.miss { color: var(--crit); }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0 6px; }
.bar input[type=search] { flex: 1 1 220px; min-width: 0; font: 14px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.bar input[type=search]:focus-visible, .bar button:focus-visible, details#toc a:focus-visible, details#toc summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar button { font: 600 12px/1 var(--head); letter-spacing: .05em; text-transform: uppercase; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; }
.bar button[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.bar button b { font-family: var(--mono); font-weight: 500; margin-left: 6px; opacity: .8; }
.count { font-size: 12.5px; color: var(--muted); margin: 0 0 4px; }
@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  details#toc { position: static; max-height: none; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 0; }
  details#toc summary { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; font: 600 12px/1 var(--head); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; color: var(--ink); }
  details#toc summary::after { content: '+'; font: 500 16px/1 var(--mono); color: var(--muted); }
  details#toc[open] summary::after { content: '\2212'; }
  details#toc .toc-h { display: none; }
  details#toc .links { padding: 4px 6px 10px; }
  details#toc .grp:first-of-type { margin-top: 4px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>

<div class="shell">
  <details id="toc" open>
    <summary>Sections</summary>
    <p class="toc-h">Sections</p>
    <div class="links" id="toc-links"></div>
  </details>
  <main>
    <header class="top">
      <div class="eyebrow">Living audit</div>
      <h1 id="doc-title">Operion Product Gap and Readiness Audit</h1>
      <div class="tagkey" aria-label="Evidence tags">
        <span><i class="tg v">V</i> verified in source, not executed</span>
        <span><i class="tg">D</i> from repo docs</span>
        <span><i class="tg u">U</i> unverified inference</span>
        <span><i class="tg">A</i> assumption about schools</span>
        <span><i class="tg r">R</i> needs external verification</span>
      </div>
    </header>
    <article id="doc"></article>
  </main>
</div>

<script type="text/markdown" id="md-src">__MARKDOWN__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function () {
  var raw = document.getElementById('md-src').textContent.replace(/<\\\/script/g, '</script');
  var doc = document.getElementById('doc');
  if (!window.marked) { doc.textContent = 'The document could not be rendered because the markdown library failed to load.'; return; }
  doc.innerHTML = marked.parse(raw, { gfm: true });

  // Title comes from the first h1; the meta table and sections follow.
  var first = doc.querySelector('h1');
  if (first) { document.getElementById('doc-title').textContent = first.textContent.replace(/\s*[—-]\s*/, ' ').replace(/&/g, 'and'); first.remove(); }

  function slug(s) { return s.toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  var h1s = Array.prototype.slice.call(doc.querySelectorAll('h1'));
  h1s.forEach(function (h) { h.id = 's-' + slug(h.textContent); });
  doc.querySelectorAll('h2').forEach(function (h, i) { h.id = 'h-' + i + '-' + slug(h.textContent); });

  // Index: grouped, numbered, static (no active-state colouring)
  var links = document.getElementById('toc-links');
  var groups = [
    ['Summary', 1, 2], ['Gaps and modules', 3, 5], ['Deep dives', 6, 18],
    ['Decisions and plan', 19, 25], ['Reference', 26, 99]
  ];
  var lastGroup = null;
  h1s.forEach(function (h) {
    var m = h.textContent.match(/^(\d+)\.\s+(.*)$/), num = m ? parseInt(m[1], 10) : 99;
    var g = groups.filter(function (x) { return num >= x[1] && num <= x[2]; })[0];
    if (g && g !== lastGroup) {
      var lab = document.createElement('div'); lab.className = 'grp'; lab.textContent = g[0]; links.appendChild(lab); lastGroup = g;
    }
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.innerHTML = '<span class="n">' + (m ? m[1] : '') + '</span><span class="t"></span>';
    a.lastChild.textContent = m ? m[2] : h.textContent.replace(/^Appendix A — /, 'Appendix: ');
    links.appendChild(a);
  });
  var tocEl = document.getElementById('toc'), narrow = window.matchMedia('(max-width: 960px)');
  if (narrow.matches) tocEl.removeAttribute('open');
  links.addEventListener('click', function (e) { if (narrow.matches && e.target.closest('a')) tocEl.removeAttribute('open'); });

  // Tables: scroll wrapper, width class, severity + MVP chips
  var tables = Array.prototype.slice.call(doc.querySelectorAll('table'));
  tables.forEach(function (t) {
    var cols = t.querySelectorAll('thead th').length;
    t.classList.add('t-' + cols);
    var w = document.createElement('div'); w.className = 'tw';
    t.parentNode.insertBefore(w, t); w.appendChild(t);
    var heads = Array.prototype.map.call(t.querySelectorAll('thead th'), function (th) { return th.textContent.trim().toLowerCase(); });
    var sev = heads.findIndex(function (h) { return h === 'sev'; });
    var mvp = heads.findIndex(function (h) { return h.indexOf('mvp') === 0; });
    t.querySelectorAll('tbody tr').forEach(function (tr) {
      var cells = tr.children;
      if (sev >= 0 && cells[sev]) {
        var m = cells[sev].textContent.trim().match(/^(Critical|High|Medium|Low)/i);
        if (m) {
          var word = m[1], rest = cells[sev].textContent.trim().slice(word.length);
          cells[sev].innerHTML = '<span class="chip ' + word.toLowerCase() + '">' + word + '</span>';
          if (rest.trim()) cells[sev].appendChild(document.createTextNode(' ' + rest.trim()));
          tr.dataset.sev = word.toLowerCase();
        }
      }
      if (mvp >= 0 && cells[mvp]) {
        var txt = cells[mvp].textContent.trim();
        if (/^Yes\b/.test(txt)) { tr.dataset.mvp = 'yes'; cells[mvp].innerHTML = '<span class="chip yes">' + txt.replace(/</g, '&lt;') + '</span>'; }
      }
    });
  });

  // Inline evidence tags and status marks (text nodes only)
  var tagRe = /\[(V|D|U|A|R)((?:\/(?:V|D|U|A|R))*)\]|(✅|◐|✖)/g;
  var walker = document.createTreeWalker(doc, NodeFilter.SHOW_TEXT, {
    acceptNode: function (n) {
      var p = n.parentNode.nodeName;
      return (p === 'CODE' || p === 'PRE' || p === 'SCRIPT') ? NodeFilter.FILTER_REJECT : (tagRe.test(n.nodeValue) ? (tagRe.lastIndex = 0, NodeFilter.FILTER_ACCEPT) : (tagRe.lastIndex = 0, NodeFilter.FILTER_REJECT));
    }
  });
  var nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(function (n) {
    var frag = document.createDocumentFragment(), s = n.nodeValue, last = 0, m;
    tagRe.lastIndex = 0;
    while ((m = tagRe.exec(s))) {
      frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      var el = document.createElement('span');
      if (m[3]) {
        el.className = 'st ' + (m[3] === '✅' ? 'ok' : m[3] === '◐' ? 'part' : 'miss');
        el.textContent = m[3] === '✅' ? '✓' : m[3] === '◐' ? '◐' : '✕';
        el.setAttribute('aria-label', m[3] === '✅' ? 'exists' : m[3] === '◐' ? 'partial' : 'missing');
      } else {
        el.className = 'tg ' + m[1].toLowerCase(); el.textContent = m[1] + m[2];
      }
      frag.appendChild(el); last = m.index + m[0].length;
    }
    frag.appendChild(document.createTextNode(s.slice(last)));
    n.parentNode.replaceChild(frag, n);
  });

  // Gap register filter (section 3)
  var reg = h1s.filter(function (h) { return /^3\.\s/.test(h.textContent); })[0];
  if (reg) {
    var rows = [], node = reg.nextElementSibling;
    while (node && node.tagName !== 'H1') {
      if (node.classList && node.classList.contains('tw')) node.querySelectorAll('tbody tr').forEach(function (r) { rows.push(r); });
      node = node.nextElementSibling;
    }
    var counts = { critical: 0, high: 0, medium: 0, low: 0 }, mvpCount = 0;
    rows.forEach(function (r) { if (counts[r.dataset.sev] !== undefined) counts[r.dataset.sev]++; if (r.dataset.mvp) mvpCount++; });
    var bar = document.createElement('div'); bar.className = 'bar';
    bar.innerHTML = '<input type="search" id="gap-q" placeholder="Filter gaps: ID, area, words" aria-label="Filter gaps">' +
      ['critical', 'high', 'medium', 'low'].map(function (s) { return '<button type="button" data-sev="' + s + '" aria-pressed="false">' + s + '<b>' + counts[s] + '</b></button>'; }).join('') +
      '<button type="button" data-mvp="1" aria-pressed="false">MVP: yes<b>' + mvpCount + '</b></button>';
    var count = document.createElement('p'); count.className = 'count'; count.id = 'gap-count';
    var intro = reg.nextElementSibling;
    reg.parentNode.insertBefore(bar, intro ? intro.nextSibling : reg.nextSibling);
    bar.parentNode.insertBefore(count, bar.nextSibling);
    var active = {}, onlyMvp = false, q = '';
    function apply() {
      var shown = 0;
      rows.forEach(function (r) {
        var ok = (!q || r.textContent.toLowerCase().indexOf(q) >= 0) &&
                 (!Object.keys(active).length || active[r.dataset.sev]) &&
                 (!onlyMvp || r.dataset.mvp === 'yes');
        r.hidden = !ok; if (ok) shown++;
      });
      var n2 = reg.nextElementSibling;
      while (n2 && n2.tagName !== 'H1') {
        if (n2.classList && n2.classList.contains('tw')) {
          var any = Array.prototype.some.call(n2.querySelectorAll('tbody tr'), function (r) { return !r.hidden; });
          n2.hidden = !any;
          if (n2.previousElementSibling && n2.previousElementSibling.tagName === 'H2') n2.previousElementSibling.hidden = !any;
        }
        n2 = n2.nextElementSibling;
      }
      count.textContent = 'Showing ' + shown + ' of ' + rows.length + ' gaps';
    }
    bar.addEventListener('input', function (e) { if (e.target.id === 'gap-q') { q = e.target.value.trim().toLowerCase(); apply(); } });
    bar.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(on));
      if (b.dataset.sev) { if (on) active[b.dataset.sev] = true; else delete active[b.dataset.sev]; }
      if (b.dataset.mvp) onlyMvp = on;
      apply();
    });
    apply();
  }
})();
</script>
