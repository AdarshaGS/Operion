plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.operion'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// STOMP-over-WebSocket for live message delivery (com.operion.messaging.ws) - the
	// app's first real-time transport; everything else in this codebase is plain REST.
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	// Exposes /v3/api-docs from the existing controllers/DTOs with no extra annotations -
	// the source of truth the frontend's generated-types.ts is generated from.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
	// RestClient.Builder autoconfiguration split into its own module in Spring Boot 4.1,
	// same class of gotcha as spring-boot-hibernate/spring-boot-flyway/spring-boot-data-jpa-test
	// above - needed for RazorpayHttpGateway, the app's first outbound HTTP integration.
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// .xlsx parsing for student bulk import (#287) - CsvUtil deliberately stayed dependency-free
	// for CSV, but there's no reasonable hand-rolled equivalent for the OOXML zip format.
	implementation 'org.apache.poi:poi-ooxml:5.3.0'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	// gson backend, not jackson - avoids clashing with this project's Jackson 3.x (tools.jackson) stack
	runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.12.6'
	runtimeOnly 'com.mysql:mysql-connector-j'
	// Embedded Tomcat stays out of the WAR's WEB-INF/lib so an external Tomcat supplies it;
	// bootWar still bundles it under WEB-INF/lib-provided so `java -jar *.war` keeps working.
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat-runtime'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
	// The suite now caches many distinct @DataJpaTest Spring contexts (one per unique
	// @Import combination) - default heap started OOM-ing partway through the run.
	maxHeapSize = '2g'
}

// Retains parameter names in bytecode so @PathVariable/@RequestParam can match by
// reflection without every one needing an explicit name - otherwise this breaks on
// every controller, not just this one.
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-parameters']
}

// Builds the React app (web/) and bundles it into the WAR under static/, so one
// `java -jar operion-*.war` serves both the UI and the API from the same origin.
// VITE_API_BASE_URL is set to empty so the UI calls relative paths (/api/v1/...).
// Skip with -PskipWeb (e.g. when web/dist is already built).
def buildWeb = tasks.register('buildWeb', Exec) {
	workingDir = file('web')
	environment 'VITE_API_BASE_URL', ''
	commandLine 'npm', 'run', 'build'
	onlyIf { !project.hasProperty('skipWeb') }
}

// src/main/resources/static/index.html is a leftover "Foundation smoke test" page, not the real
// UI. It is excluded from the build output so the React app's index.html (bundled below) is the
// one the WAR serves at "/".
tasks.named('processResources') {
	exclude 'static/index.html'
}

tasks.named('bootWar') {
	dependsOn buildWeb
	from('web/dist') {
		into 'WEB-INF/classes/static'
	}
}
