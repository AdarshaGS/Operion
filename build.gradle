plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.operion'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Exposes /v3/api-docs from the existing controllers/DTOs with no extra annotations -
	// the source of truth the frontend's generated-types.ts is generated from.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
	// RestClient.Builder autoconfiguration split into its own module in Spring Boot 4.1,
	// same class of gotcha as spring-boot-hibernate/spring-boot-flyway/spring-boot-data-jpa-test
	// above - needed for RazorpayHttpGateway, the app's first outbound HTTP integration.
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	// gson backend, not jackson - avoids clashing with this project's Jackson 3.x (tools.jackson) stack
	runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.12.6'
	runtimeOnly 'com.mysql:mysql-connector-j'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
	// The suite now caches many distinct @DataJpaTest Spring contexts (one per unique
	// @Import combination) - default heap started OOM-ing partway through the run.
	maxHeapSize = '2g'
}

// Retains parameter names in bytecode so @PathVariable/@RequestParam can match by
// reflection without every one needing an explicit name - otherwise this breaks on
// every controller, not just this one.
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-parameters']
}
