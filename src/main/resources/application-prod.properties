# Production - quieter logs, no internal detail on the health endpoint response body.
logging.level.com.operion=INFO
management.endpoint.health.show-details=never

# The OpenAPI spec and Swagger UI map every endpoint, DTO and auth scheme for anyone who can reach the host (publicly
# readable). Dev-only: the frontend's generate:api-types script reads /v3/api-docs from a local dev server.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
