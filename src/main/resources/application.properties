spring.application.name=operion
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Only /actuator/health is exposed - this app deliberately runs without the full Spring
# Security starter (spring-security-crypto only, see ai-context/load-context.md), so
# there is no filter chain to gate actuator endpoints. Any other endpoint (env, beans,
# mappings) would be unauthenticated and public - health alone is safe to expose as-is.
management.endpoints.web.exposure.include=health

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/operion}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Schema is Flyway-managed (db/migration) - Hibernate only validates entities against it, never generates DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Dev-only default secret - MUST be overridden via JWT_SECRET in any real deployment.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-any-real-deployment-32bytes-min}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Brute-force protection on /login - see LoginAttemptService. Single-instance in-memory
# tracker, not shared/persisted, same v1 trade-off as app.razorpay.* below.
app.auth.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.auth.lockout-duration-minutes=${AUTH_LOCKOUT_DURATION_MINUTES:15}

# Platform-admin token plane - deliberately a separate secret from app.jwt.secret above,
# see PlatformJwtService. MUST be overridden via PLATFORM_JWT_SECRET in any real deployment.
app.jwt.platform-secret=${PLATFORM_JWT_SECRET:dev-only-platform-secret-change-me-before-any-real-deployment-32b}
app.jwt.platform-expiration-minutes=${PLATFORM_JWT_EXPIRATION_MINUTES:120}

# One shared platform Razorpay account for every organisation - a deliberate v1
# simplification, see RazorpayCredentialsProvider's own note. Empty by default: the app
# boots and every other module works fine with no keys set, calls to Razorpay just fail
# cleanly until real test-mode keys are provided via env vars.
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.email.brevo.api-key=${BREVO_API_KEY:}
app.email.brevo.sender-email=${BREVO_SENDER_EMAIL:}
app.email.brevo.sender-name=${BREVO_SENDER_NAME:Operion}
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.resend.sender-email=${RESEND_SENDER_EMAIL:}
app.email.resend.sender-name=${RESEND_SENDER_NAME:Operion}

# Restricted, SELECT-only connection used only by ReportExecutionService to run
# user-authored report SQL against the curated reporting_* views (V58) - same `operion`
# database as the main connection, but granted SELECT per-view only, never on the app's
# real tables. Credentials must match the reporting_ro user seeded in V55 - dev-only
# default, MUST be rotated (via a manual ALTER USER, Flyway migrations don't re-run)
# before any real deployment, same trade-off as the platform-admin seed.
app.reporting.datasource.url=${REPORTING_DB_URL:jdbc:mysql://localhost:3306/operion?allowPublicKeyRetrieval=true}
app.reporting.datasource.username=${REPORTING_DB_USERNAME:reporting_ro}
app.reporting.datasource.password=${REPORTING_DB_PASSWORD:changeme-reporting-ro}
