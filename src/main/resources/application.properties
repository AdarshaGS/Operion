spring.application.name=operion
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Only /actuator/health is exposed - this app deliberately runs without the full Spring
# Security starter (spring-security-crypto only, see ai-context/load-context.md), so
# there is no filter chain to gate actuator endpoints. Any other endpoint (env, beans,
# mappings) would be unauthenticated and public - health alone is safe to expose as-is.
management.endpoints.web.exposure.include=health

# Two databases (no database per organisation): the School DB holds all school data for every
# school, isolated by organisation_id; the Platform DB holds organisations, plans/billing,
# feature flags, platform admins, CRM and support. Each has its own Flyway folder
# (db/migration/school, db/migration/platform) - see DatabaseMigrationConfig.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/operion_school}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
app.platform.datasource.url=${PLATFORM_DB_URL:jdbc:mysql://localhost:3306/operion_platform}
app.platform.datasource.username=${PLATFORM_DB_USERNAME:${DB_USERNAME:root}}
app.platform.datasource.password=${PLATFORM_DB_PASSWORD:${DB_PASSWORD:}}
# Boot's single-datasource Flyway auto-config is replaced by DatabaseMigrationConfig.
spring.flyway.enabled=false

# Schema is Flyway-managed (db/migration/school and /platform) - Hibernate only validates entities against it, never generates DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Dev-only default secret - MUST be overridden via JWT_SECRET in any real deployment.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-any-real-deployment-32bytes-min}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Brute-force protection on /login - see LoginAttemptService (state lives in login_attempts).
app.auth.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.auth.lockout-duration-minutes=${AUTH_LOCKOUT_DURATION_MINUTES:15}

# Platform-admin token plane - deliberately a separate secret from app.jwt.secret above,
# see PlatformJwtService. MUST be overridden via PLATFORM_JWT_SECRET in any real deployment.
app.jwt.platform-secret=${PLATFORM_JWT_SECRET:dev-only-platform-secret-change-me-before-any-real-deployment-32b}
app.jwt.platform-expiration-minutes=${PLATFORM_JWT_EXPIRATION_MINUTES:120}

# Sets the platform console password at startup for any platform admin still on the seeded one
# (see PlatformAdminPasswordBootstrap). Never overwrites a password that was already changed.
app.platform.admin-password=${PLATFORM_ADMIN_PASSWORD:}

# SecretsGuard: with the prod profile, startup fails while any secret above or below is still a
# published default, empty or too short. enforce / warn override that; blank = enforce only on prod.
app.security.secrets-guard=${SECRETS_GUARD:}

# One shared platform Razorpay account for every organisation - a deliberate v1
# simplification, see RazorpayCredentialsProvider's own note. Empty by default: the app
# boots and every other module works fine with no keys set, calls to Razorpay just fail
# cleanly until real test-mode keys are provided via env vars.
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Local-disk asset storage (LocalDiskAssetStorageService, see #25) - MVP backend behind
# the AssetStorageService seam, swappable later without touching callers. Spring's own
# multipart limit is set to the same 5MB ceiling as the service's own check, so an
# oversized upload is rejected before it's even read into memory.
app.storage.local.base-dir=${STORAGE_BASE_DIR:./data/uploads}
# Local backups (BackupService): mysqldump of both databases + a zip of the uploads folder, one folder per
# backup, newest BACKUP_KEEP kept. The nightly schedule is off unless BACKUP_ENABLED=true - a real install
# must turn it on (System Health shows Backups as down until a backup under a day old exists). Put
# BACKUP_DIR on a different disk from the database, and copy it off the machine as well.
app.backup.enabled=${BACKUP_ENABLED:false}
app.backup.dir=${BACKUP_DIR:./data/backups}
app.backup.keep=${BACKUP_KEEP:14}
app.backup.cron=${BACKUP_CRON:0 30 2 * * *}
# Blank = the server's own time zone, so 02:30 is 02:30 where the server runs; set e.g. Asia/Kolkata to pin it.
app.backup.zone=${BACKUP_ZONE:}

# Boot's default scheduler has one thread, so a long @Scheduled job (a backup's mysqldump) would hold up
# every other one (notification dispatch, scheduled announcements, ...). Several threads keep them independent.
spring.task.scheduling.pool.size=${SCHEDULER_POOL_SIZE:4}
app.backup.mysqldump=${BACKUP_MYSQLDUMP:mysqldump}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Brevo credentials now live in the external_services / external_service_properties
# tables (see com.operion.integration), configurable from the platform-admin
# Integrations screen - no app.email.brevo.* / app.sms.brevo.* properties here anymore.
# Symmetric key used to encrypt secret-flagged external_service_properties rows at rest
# (see ExternalServiceSecretCipher) - MUST be overridden via INTEGRATION_SECRET_KEY in
# any real deployment, same convention as app.jwt.secret above.
app.integration.secret-key=${INTEGRATION_SECRET_KEY:dev-only-integration-secret-change-me-before-any-real-deployment}
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.resend.sender-email=${RESEND_SENDER_EMAIL:}
app.email.resend.sender-name=${RESEND_SENDER_NAME:Operion}

# Restricted, SELECT-only connection used only by ReportExecutionService to run
# user-authored report SQL against the curated reporting_* views (V58) - same `operion`
# database as the main connection, but granted SELECT per-view only, never on the app's
# real tables. Credentials must match the reporting_ro user seeded in V55 - dev-only
# default, MUST be rotated (via a manual ALTER USER, Flyway migrations don't re-run)
# before any real deployment, same trade-off as the platform-admin seed.
app.reporting.datasource.url=${REPORTING_DB_URL:jdbc:mysql://localhost:3306/operion_school?allowPublicKeyRetrieval=true}
app.reporting.datasource.username=${REPORTING_DB_USERNAME:root}
app.reporting.datasource.password=${REPORTING_DB_PASSWORD:mysql}
