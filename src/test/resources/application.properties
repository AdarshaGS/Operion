spring.application.name=operion

# Tests run against in-memory H2, schema generated straight from entities - Flyway's
# MySQL-specific migrations aren't exercised here, only the JPA/tenant-isolation layer.
spring.datasource.url=jdbc:h2:mem:operion;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

app.jwt.secret=test-only-secret-not-for-real-use-but-still-32-bytes-min
app.jwt.expiration-minutes=480

app.jwt.platform-secret=test-only-platform-secret-not-for-real-use-but-still-32-bytes-min
app.jwt.platform-expiration-minutes=120

# ReportingDataSourceConfig needs a second DataSource bean to exist for a full context
# load to succeed - the `reporting` schema/views it would point to in real life are
# MySQL-only (V54/V55, Flyway disabled here), so no test actually queries through this,
# it just needs to build without error.
app.reporting.datasource.url=jdbc:h2:mem:reporting;MODE=MySQL;DB_CLOSE_DELAY=-1
app.reporting.datasource.username=sa
app.reporting.datasource.password=
